<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560">
  <rect width="1040" height="560" fill="#f6f8fa"/>
  <rect x="40" y="32" width="960" height="496" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="78" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">EV09 - Persistencia con SQLAlchemy</text>
  <text x="68" y="112" fill="#57606a" font-family="Arial, sans-serif" font-size="18">SQLite genera device_systems.db y SQLAlchemy crea la tabla users</text>
  <rect x="68" y="152" width="904" height="300" rx="6" fill="#0d1117"/>
  <text x="92" y="194" fill="#79c0ff" font-family="Consolas, monospace" font-size="20">app/database/connection.py</text>
  <text x="92" y="232" fill="#e6edf3" font-family="Consolas, monospace" font-size="18">DATABASE_URL = "sqlite:///./device_systems.db"</text>
  <text x="92" y="270" fill="#e6edf3" font-family="Consolas, monospace" font-size="18">engine = create_engine(DATABASE_URL)</text>
  <text x="92" y="308" fill="#e6edf3" font-family="Consolas, monospace" font-size="18">SessionLocal = sessionmaker(bind=engine)</text>
  <text x="92" y="346" fill="#e6edf3" font-family="Consolas, monospace" font-size="18">Base.metadata.create_all(bind=engine)</text>
  <text x="92" y="400" fill="#56d364" font-family="Consolas, monospace" font-size="18">Tabla users: id, name, email(unique), role, is_active, created_at</text>
  <text x="68" y="496" fill="#57606a" font-family="Consolas, monospace" font-size="18">Modelo SQLAlchemy: app/models/user_model.py | Schema Pydantic: app/schemas/user_schema.py</text>
</svg>

